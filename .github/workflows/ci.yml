name: AlphaEngine C++20 HFT CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test tools
        run: pip install pytest

      - name: Compile and Run Unit & White-Box Tests
        run: make test

      - name: Run Clang AddressSanitizer & UBSan Memory Audit
        run: make asan

      - name: Execute End-to-End Demo Walkthrough
        run: make demo
